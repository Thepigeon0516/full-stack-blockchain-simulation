<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hippo Crypto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark">
    <div class="container d-flex justify-content-center align-items-center vh-100"> 
        <div class="card col-11 col-md-5" id="divDashboard">
            <div class="card-body">
                <div class="d-flex justify-content-center mb-3">
                    <img src="images/hippo.svg" alt="HippoCrypto Logo" class="col-5">
                </div>
                <h2 class="text-center mb-4">Hippo Crypto</h2>
                
                <h4 class="mt-4">Mine a Block</h4>
                <form>
                    <label class="form-label" for ="txtTransAmount">Amount</label>
                    <input class="form-control" id="txtTransAmount" type="number">
                    <label class="form-label" for ="txtTransSender">Sender</label>
                    <input class="form-control" id="txtTransSender" type="text">
                    <label class="form-label" for ="txtTransRecipient">Recipient</label>
                    <input class="form-control" id="txtTransRecipient" type="text">
                    <button id="btnMineBlock" class="btn btn-primary col-12 mt-2" type="button">Mine Block</button>
                </form>
                
                <h4 class="mt-4">The Blockchain</h4>
                <button id="btnViewChain" class="btn btn-primary col-12 mt-2" type="button">View/Refresh Chain</button>

                <div class="table-responsive" id="divChainOutput">
                    <table id="tblChain" class="table table-striped">
                        <thead>
                            <tr>
                                <th>Index</th>
                                <th>Time</th>
                                <th>Sender</th>
                                <th>Recipient</th>
                                <th>Amount</th>
                                <th>Hash</th>
                            </tr>
                        </thead>
                        <tbody>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
</body>
</html>
